name: queue worker
# STEM Racing job queue (http://139.185.60.30:8090). Pick now on the panel puts this one file in
# your repo and starts it. Each slot takes a job from the queue, runs it, reports it, and takes
# the next one, until the queue is empty or the slot has worked 3 hours (GitHub stops a job at 6 h).
# A job is a car (build + airflow test: half car, 4 cores, hierarchical split, 1000 iterations),
# a code-test shard or a lab script. The code and reference files come from the queue server
# (checked by SHA-256), never from another GitHub repo. A solve that would pass the 6 h limit
# saves itself and goes back to the queue to continue. No secrets: every request proves its
# account, run and workflow file with GitHub's signed OIDC token.
on:
  workflow_dispatch:
    inputs:
      slots: { description: "Slots in this run (max 256)", default: "256" }
      parallel: { description: "Slots at once (20 free, 40 Pro)", default: "20" }
permissions: { contents: write, id-token: write }   # release files for long runs; signed identity
env:
  QUEUE: http://139.185.60.30:8090
  GH_TOKEN: ${{ github.token }}
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 pytest
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  LOOP_MINUTES: "180"          # take another job only while the slot has worked less than this
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: { slots: "${{ steps.s.outputs.slots }}" }
    steps:
      - id: s
        env: { N: "${{ inputs.slots }}" }
        run: python3 -c "import os; n=max(1,min(256,int(os.environ['N']))); print('slots='+str(list(range(1,n+1))))" >> "$GITHUB_OUTPUT"
  car:
    needs: plan
    name: slot ${{ matrix.slot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { slot: "${{ fromJSON(needs.plan.outputs.slots) }}" }
    steps:
      - name: Write the worker
        run: |
          echo "SLOT_START=$(date +%s)" >> "$GITHUB_ENV"
          cat > worker.py <<'PY'
          """One queue slot: claim -> fetch -> run -> report, repeated (see the header of queue_worker.yml)."""
          import glob, hashlib, json, os, shutil, subprocess, sys, time, urllib.error, urllib.request
          Q = os.environ["QUEUE"]
          WS = os.environ["GITHUB_WORKSPACE"]


          def identity():
              t = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=stem-queue",
                                         headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              return json.loads(urllib.request.urlopen(t, timeout=30).read())["value"]


          def claim(slot):
              """-> job dict, None (queue empty), or stops the slot on a refusal."""
              for t in range(5):
                  try:
                      rq = urllib.request.Request(Q + "/claim", json.dumps({"slot": slot}).encode(), method="POST",
                                                  headers={"Authorization": "Bearer " + identity()})
                      with urllib.request.urlopen(rq, timeout=60) as r:
                          return None if r.status == 204 else json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      raise SystemExit(f"::error::The queue refused this slot (HTTP {e.code}): {e.read()[:300]!r}")
                  except Exception as e:
                      print("retry claim", e)
                      time.sleep(10)
              raise SystemExit("::error::could not reach the queue")


          def fetch(url, sha, to):
              url = url if "://" in url else Q + url
              p = os.path.join(__import__("tempfile").gettempdir(), "dl_" + hashlib.sha1(url.encode()).hexdigest())
              for t in range(5):
                  try:
                      hd = {"Authorization": "Bearer " + identity()} if url.startswith(Q) else {}
                      with urllib.request.urlopen(urllib.request.Request(url, headers=hd), timeout=600) as r, open(p, "wb") as out:
                          for chunk in iter(lambda: r.read(1 << 20), b""):
                              out.write(chunk)
                      break
                  except Exception as e:
                      print("retry", url, e)
                      time.sleep(10)
              h = hashlib.sha256()
              with open(p, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              if sha and not h.hexdigest().startswith(sha):
                  raise RuntimeError(f"sha256 mismatch for {url}: {h.hexdigest()}")
              os.makedirs(to, exist_ok=True)
              subprocess.run(["unzip", "-q", "-o", p, "-d", to] if url.endswith(".zip") else ["tar", "-xf", p, "-C", to], check=True)
              os.remove(p)
              print("fetched", url, "->", to, h.hexdigest()[:16])


          def release_file(path, name):
              """A big file as a public release asset of this repo -> its URL."""
              repo = os.environ["GITHUB_REPOSITORY"]
              subprocess.run(["gh", "release", "create", "queue-files", "-R", repo, "--title", "Queue files",
                              "--notes", "Saved CFD cases and checkpoints from the job queue."], capture_output=True)
              os.rename(path, name)
              subprocess.run(["gh", "release", "upload", "queue-files", name, "--clobber", "-R", repo], check=True)
              return f"https://github.com/{repo}/releases/download/queue-files/{name}"


          def run_one(job):
              r, jid = job["recipe"], job["id"]
              for d in ("code", "out", "/tmp/case", "/tmp/refmesh", "/tmp/base"):
                  shutil.rmtree(d, ignore_errors=True)
              if os.path.exists("ckpt_path.txt"):
                  os.remove("ckpt_path.txt")
              os.makedirs("out/r", exist_ok=True)
              out = {"id": jid, "ok": False,
                     "run": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     "cpu": subprocess.getoutput("lscpu | grep 'Model name' | sed 's/.*: *//'")}
              t0 = time.time()
              env = dict(os.environ, P2_CHECKPOINT_FILE=f"{WS}/ckpt_path.txt", P2_FORCE_OUT=f"{WS}/out/r/forces",
                         P2_JOB_DEADLINE=str(int(os.environ["SLOT_START"]) + 340 * 60))
              env.pop("P2_RESUME_CASE", None)
              if not r.get("resume_url"):        # test-only settings, first link only (e.g. force a save-and-continue)
                  for k, v in (r.get("env") or {}).items():
                      if k in ("P2_SOLVE_BUDGET_S",):
                          env[k] = str(v)
              logtxt = ""
              try:
                  fetch(f"/code/{r['ref']}.tar.gz", r["code_sha256"], "code")
                  for f in r.get("fetch", []):
                      fetch(f["url"], f.get("sha256"), f["to"])
                  if r.get("resume_url"):
                      fetch(r["resume_url"], None, "/tmp/case")
                      env["P2_RESUME_CASE"] = "/tmp/case/run"
                  if r.get("kind") == "pytest":
                      cmd, cwd = [sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider"] + r["args"], os.path.join("code", r["dir"])
                  elif r.get("kind") == "lab":
                      cmd, cwd = [sys.executable, "-W", "ignore", "../.github/lab/" + r["script"]] + r["args"], "code/part5-simulation"
                  else:
                      cmd, cwd = [sys.executable, "-W", "ignore", "run_car.py", "--out", f"{WS}/out/r"] + r["args"], "code/part5-simulation"
                  with open("out/r/log.txt", "w") as log:
                      rc = subprocess.call(cmd, cwd=cwd, env=env, stdout=log, stderr=subprocess.STDOUT)
                  logtxt = open("out/r/log.txt", errors="replace").read()
                  print(logtxt[-4000:])
                  out["minutes"] = str(round((time.time() - t0) / 60))
                  if r.get("kind") in ("pytest", "lab"):
                      out["ok"] = rc == 0
                      out["tail"] = logtxt[-6000:]
                      out["lab_lines"] = [l for l in logtxt.splitlines() if l.startswith("LAB ")][:400]
                      out["log"] = logtxt[-200000:]          # the whole test or lab output, for the parts
                  elif os.path.exists("ckpt_path.txt"):            # saved at the time limit: continue later
                      run = open("ckpt_path.txt").read().strip()
                      subprocess.run(["tar", "-cf", "case.tar", "-C", os.path.dirname(run),
                                      "--transform", f"s|^{os.path.basename(run)}|run|", os.path.basename(run)], check=True)
                      out["checkpoint_url"] = release_file("case.tar", f"{jid}-link{int(r.get('link', 1))}.tar")
                  else:
                      s = json.load(open("out/r/summary.json"))
                      out["summary"] = s
                      wants_cfd = "--cfd" in r.get("args", [])
                      failed_rules = s.get("legality", {}).get("summary", {}).get("failed", [])
                      if wants_cfd and "cfd_initial" not in s and "--cfd-if-legal" in r.get("args", []) and failed_rules:
                          out["illegal"], out["ok"] = failed_rules, rc == 0   # the referee stopped it: a real answer
                      else:
                          out["ok"] = rc == 0 and (bool(s.get("cfd_initial", {}).get("converged")) if wants_cfd else True)
                      if r.get("save_case") and out["ok"]:             # keep the finished case (for warm starts)
                          runs = sorted(glob.glob("/tmp/case/run") or glob.glob("code/part2-simulation/cfd_case_template/runs/*/"))
                          subprocess.run(f"cd '{runs[0]}' && tar --exclude='processor*' --exclude=logs --exclude=postProcessing -cf - . | gzip > {WS}/case.tgz",
                                         shell=True, check=True)
                          out["case_url"] = release_file("case.tgz", f"{jid}-case.tgz")
                          if os.path.exists("out/r/body_half.stl"):
                              shutil.copy("out/r/body_half.stl", "body.stl")
                              out["body_url"] = release_file("body.stl", f"{jid}-body_half.stl")
                  if not out["ok"] and "tail" not in out:
                      out["tail"] = logtxt[-3000:]
              except Exception as e:
                  out["ok"], out["error"] = False, repr(e)[:500]
                  if os.path.exists("out/r/log.txt"):
                      out["tail"] = open("out/r/log.txt", errors="replace").read()[-3000:]
              if os.path.exists("out/r/body_half.stl"):
                  out["body_sha256"] = hashlib.sha256(open("out/r/body_half.stl", "rb").read()).hexdigest()
              fd = sorted(glob.glob("out/r/forces/forces_force.dat")) or sorted(glob.glob("out/r/**/force*.dat", recursive=True))
              out["forces_file"] = fd[0] if fd else None
              out["forces"] = open(fd[0]).read() if fd else ""
              for t in range(5):
                  try:
                      rq = urllib.request.Request(Q + "/result", json.dumps(out).encode(), method="POST",
                                                  headers={"Authorization": "Bearer " + identity()})
                      print("reported", jid, urllib.request.urlopen(rq, timeout=120).status, "ok" if out["ok"] else "NOT ok")
                      break
                  except Exception as e:
                      print("retry report", e)
                      time.sleep(10)
              return out["ok"]


          slot, start, n = int(sys.argv[1]), int(os.environ["SLOT_START"]), 0
          while True:
              job = claim(slot)
              if job is None:
                  print(f"No job waiting. This slot ran {n} job(s).")
                  break
              n += 1
              print(f"=== job {n}: {job['id']}")
              run_one(job)
              if time.time() - start > int(os.environ["LOOP_MINUTES"]) * 60:
                  print(f"Slot time used up after {n} job(s).")
                  break
          PY
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
          pip install $PY_DEPS
      - name: Work through jobs from the queue
        run: python worker.py ${{ matrix.slot }}
